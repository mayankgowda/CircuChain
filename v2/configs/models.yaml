# CircuChain v2 — local model panel (M5).  Each enabled entry is one column in every results table.
#
# The panel is deliberately built to span THREE orthogonal factors so the paper can make causal
# claims about what drives the compliance-competence trade-off, not just rank models:
#   C1  reasoning toggle, same base   : qwen3 :think vs :nothink  (or Instruct vs Thinking siblings)
#   C2  reasoning-SFT, same 70B base  : llama3.3-70b  vs  deepseek-r1-distill-llama-70b
#   C3  pure scale ladder, one family : qwen3 1.7b -> 4b -> 8b -> 14b -> 32b
#
# model_id is an Ollama tag by default (backend: ollama). For MLX set backend: mlx and put the
# HF repo id in model_id (e.g. mlx-community/Qwen3-14B-4bit). Verify availability with:
#   circuchain models --installed        (cross-checks this file against `ollama list`)
# Entries marked `verify: true` are H1-2026 releases — confirm the tag is live before freezing.

defaults:
  backend: ollama
  temperature: 0.0
  seed: 20260709
  max_tokens: 8192          # non-reasoning; runner overrides to 16384 for role_axis: reasoning
  num_ctx: 8192

models:
  # ---- C3: pure scale ladder (hold family + recipe fixed, vary params) ----
  - {key: qwen3-1.7b,  model_id: "qwen3:1.7b",  family: qwen, role_axis: reasoning, scale_tier: 1.7b, think: true, contrast: C3-scale, enabled: true}
  - {key: qwen3-4b,    model_id: "qwen3:4b",    family: qwen, role_axis: reasoning, scale_tier: 4b,   think: true, contrast: C3-scale, enabled: true}
  - {key: qwen3-8b,    model_id: "qwen3:8b",    family: qwen, role_axis: reasoning, scale_tier: 8b,   think: true, contrast: C3-scale, enabled: true}
  - {key: qwen3-14b,   model_id: "qwen3:14b",   family: qwen, role_axis: reasoning, scale_tier: 14b,  think: true, contrast: "C3-scale,C1-reason", enabled: true}
  - {key: qwen3-32b,   model_id: "qwen3:32b",   family: qwen, role_axis: reasoning, scale_tier: 32b,  think: true, contrast: C3-scale, enabled: true}

  # ---- C1: reasoning toggle on a single base (same weights, /think on vs off) ----
  # Qwen3 supports a runtime think toggle; run qwen3-14b twice (think:true / think:false) to get a
  # WITHIN-MODEL reasoning contrast with zero confounds. The runner emits both as separate columns.
  - {key: qwen3-14b-nothink, model_id: "qwen3:14b", family: qwen, role_axis: base, scale_tier: 14b, think: false, contrast: C1-reason, enabled: true}

  # ---- C2: reasoning-SFT natural experiment (same 70B base, +/- R1 distillation) ----
  - {key: llama33-70b,    model_id: "llama3.3:70b",   family: llama,           role_axis: base,      scale_tier: 70b, think: false, contrast: C2-sft, enabled: true}
  - {key: ds-r1-llama-70b, model_id: "deepseek-r1:70b", family: deepseek-distill, role_axis: reasoning, scale_tier: 70b, think: true,  contrast: C2-sft, enabled: true}

  # ---- lineage / diversity anchors (rule out "Qwen artifact") ----
  - {key: gpt-oss-20b, model_id: "gpt-oss:20b", family: openai-oss, role_axis: reasoning, scale_tier: 20b-moe, quant: mxfp4, think: true,  enabled: true}
  - {key: gemma3-27b,  model_id: "gemma3:27b",  family: gemma,      role_axis: base,      scale_tier: 27b,     think: false, enabled: true}

  # ---- top reasoning tier (MoE keeps decode cheap; verify tag before freezing) ----
  - {key: qwen3-next-80b, model_id: "qwen3-next:80b-a3b", family: qwen, role_axis: reasoning, scale_tier: 80b-moe, think: true, verify: true, enabled: false}
  # fallbacks if the 80B tag isn't available: gpt-oss:120b (fits 128GB) or deepseek-r1:32b

# Optional frontier ceiling — generalization only, NEVER a headline number, T6-impossible (no trace).
# Needs API keys in .env; ~$150-300 total at full N. Left disabled by default.
api_models:
  - {key: gpt-5,    backend: openai,    model_id: "gpt-5",                          role_axis: reasoning, enabled: false}
  - {key: opus-4-5, backend: anthropic, model_id: "claude-opus-4-5-20251101",       role_axis: reasoning, enabled: false}
