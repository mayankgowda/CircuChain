# CircuChain v2 — local model panel served by LM STUDIO (OpenAI-compatible API on :1234).
#
# Causal design (updated 2026-07-11 after inventory verification):
#   C1  reasoning toggle, SAME weights : the ORIGINAL Qwen3 hybrid family, /think vs /no_think.
#       VERIFIED WORKING through LM Studio MLX on 1.7b (258->1 reasoning tokens) and 4b (217->1).
#       The qwen3.5/3.6 generation is thinking-only (all off-switches are no-ops; verified).
#   C2  reasoning-SFT, same base       : Qwen2.5-Instruct vs its DeepSeek-R1 distilled sibling.
#   C3  pure scale ladder, one family  : Qwen3 dense 1.7b -> 4b -> 8b -> 14b -> 32b.
#       (Qwen3.6 has NO small dense sizes — the family is only 27B + 35B-A3B. C3 therefore
#        lives in the Qwen3 hybrid family, which also carries C1 at every rung.)
#
# DECODING POLICY (uniform across the panel — kills cross-column sampling confounds):
#   temperature 0.6, top_p 0.95, top_k 20, single sample per instance.
#   Rationale: greedy temp=0 provably drives thinking models into unbounded rumination on this
#   task (smoke 2026-07-10: qwen3.5-9b truncated 32/32; qwen3.6-27b truncated at 12k tokens).
#   Vendor guidance for Qwen thinking models explicitly recommends this sampled policy.
#   LM Studio's MLX engine IGNORES `seed` (verified) -> sampled completions are not bit-
#   reproducible; the content-addressed cache under results/cache is the frozen artifact.
#   Within-pair contrasts (C1 think/nothink) hold sampling FIXED so the toggle is the only diff.
#
# model_id must EXACTLY match an id from `lms ls` / GET /api/v0/models.
# !! CONTEXT TRAP !! Always pre-load with a constrained context (JIT defaults to 262144):
#     lms load <model_id> --context-length 32768 --gpu max -y

defaults:
  backend: lmstudio
  host: "http://localhost:1234"
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  seed: 20260709            # recorded for provenance; MLX ignores it (see policy note)
  max_tokens: 16384         # per-model override below after the calibration pilot
  num_ctx: 32768            # must match the --context-length you loaded with
  concurrency: 4            # LM Studio serves 4 parallel slots (lms ps: PARALLEL 4)

models:
  # ===========================================================================
  # PRESENT on this M5 (ids verified via /api/v0/models, 2026-07-11)
  # ===========================================================================

  # --- C1 + C3: the Qwen3 hybrid dense family (toggle verified working) ---
  - {key: qwen3-1.7b-think, serve_id: "sweep-qwen3-1.7b",   model_id: "qwen/qwen3-1.7b", family: qwen3, role_axis: reasoning, scale_tier: 1.7b, engine: mlx, quant: 8bit, think: true,  think_style: qwen_slash, contrast: "C1-reason,C3-scale", enabled: true}
  - {key: qwen3-1.7b-nothink, serve_id: "sweep-qwen3-1.7b", model_id: "qwen/qwen3-1.7b", family: qwen3, role_axis: base,      scale_tier: 1.7b, engine: mlx, quant: 8bit, think: false, think_style: qwen_slash, contrast: "C1-reason", max_tokens: 4096, enabled: true}
  - {key: qwen3-4b-think, serve_id: "sweep-qwen3-4b",     model_id: "qwen/qwen3-4b",   family: qwen3, role_axis: reasoning, scale_tier: 4b,   engine: mlx, quant: 8bit, think: true,  think_style: qwen_slash, contrast: "C1-reason,C3-scale", enabled: true}
  - {key: qwen3-4b-nothink, serve_id: "sweep-qwen3-4b",   model_id: "qwen/qwen3-4b",   family: qwen3, role_axis: base,      scale_tier: 4b,   engine: mlx, quant: 8bit, think: false, think_style: qwen_slash, contrast: "C1-reason", max_tokens: 4096, enabled: true}

  # --- C2 base (re-downloaded 2026-07-11, now a healthy 4.68 GB; the old 84MB copy was corrupt) ---
  - {key: qwen25-7b-instruct, serve_id: "sweep-qwen2.5-7b-instruct", model_id: "qwen2.5-7b-instruct", family: qwen2.5, role_axis: base, scale_tier: 7b, engine: gguf, quant: Q4_K_M, think_style: none, contrast: "C2-sft", max_tokens: 4096, enabled: true}

  # --- anchors (newer-gen Qwen + MoE + non-Qwen lineage) ---
  - {key: qwen36-27b,     model_id: "qwen3.6-27b-mlx",      family: qwen3.6, role_axis: reasoning, scale_tier: 27b,     engine: mlx,  quant: 8bit, think: true, think_style: qwen_slash, enabled: true}
  - {key: qwen36-35b-a3b, model_id: "qwen/qwen3.6-35b-a3b", family: qwen3.6, role_axis: reasoning, scale_tier: 35b-moe, engine: mlx,  quant: 8bit, think: true, think_style: qwen_slash, enabled: true}
  - {key: gemma4-31b, serve_id: "sweep-gemma4-31b", concurrency: 4,     model_id: "google/gemma-4-31b-qat", family: gemma4, role_axis: base,     scale_tier: 31b,     engine: gguf, quant: Q4_0, think_style: none, enabled: false}  # -> back to API (frees GPU for local-only work)

  # ===========================================================================
  # DOWNLOADING / TO DOWNLOAD — flip enabled once `lms ls` shows them; fix ids to the live id.
  # ===========================================================================
  - {key: qwen3-8b-think, serve_id: "sweep-qwen3-8b",    model_id: "qwen/qwen3-8b",  family: qwen3, role_axis: reasoning, scale_tier: 8b,  think: true,  think_style: qwen_slash, contrast: "C1-reason,C3-scale", enabled: true}
  - {key: qwen3-8b-nothink, serve_id: "sweep-qwen3-8b",  model_id: "qwen/qwen3-8b",  family: qwen3, role_axis: base,      scale_tier: 8b,  think: false, think_style: qwen_slash, contrast: "C1-reason", max_tokens: 4096, enabled: true}
  - {key: qwen3-14b-think, serve_id: "sweep-qwen3-14b",   model_id: "qwen/qwen3-14b", family: qwen3, role_axis: reasoning, scale_tier: 14b, think: true,  think_style: qwen_slash, contrast: "C1-reason,C3-scale", enabled: true}
  - {key: qwen3-14b-nothink, serve_id: "sweep-qwen3-14b", model_id: "qwen/qwen3-14b", family: qwen3, role_axis: base,      scale_tier: 14b, think: false, think_style: qwen_slash, contrast: "C1-reason", max_tokens: 4096, enabled: true}
  - {key: qwen3-32b-think, serve_id: "sweep-qwen3-32b",   model_id: "qwen/qwen3-32b", family: qwen3, role_axis: reasoning, scale_tier: 32b, think: true,  think_style: qwen_slash, contrast: "C1-reason,C3-scale", enabled: true}
  - {key: qwen3-32b-nothink, serve_id: "sweep-qwen3-32b", model_id: "qwen/qwen3-32b", family: qwen3, role_axis: base,      scale_tier: 32b, think: false, think_style: qwen_slash, contrast: "C1-reason", max_tokens: 4096, enabled: true}

  - {key: r1-distill-7b,   model_id: "deepseek-r1-distill-qwen-7b",             family: deepseek-distill, role_axis: reasoning, scale_tier: 7b,  think_style: none, contrast: "C2-sft", needs_download: true, enabled: false}
  - {key: qwen25-32b, serve_id: "sweep-qwen2.5-32b",      model_id: "qwen2.5-32b-instruct", family: qwen2.5, role_axis: base, scale_tier: 32b, think_style: none, contrast: "C2-sft-32b", max_tokens: 4096, enabled: true}
  - {key: r1-distill-32b, serve_id: "sweep-r1-distill-32b", concurrency: 4,  model_id: "deepseek-r1-distill-qwen-32b-mlx", family: deepseek-distill, role_axis: reasoning, scale_tier: 32b, think_style: none, contrast: "C2-sft-32b", enabled: true}
  - {key: gpt-oss-120b,    model_id: "gpt-oss-120b",                            family: openai-oss,       role_axis: reasoning, scale_tier: 120b-moe, think_style: none, needs_download: true, enabled: false}

  # ===========================================================================
  # API OFFLOAD via Together AI (backend openai_compat, key from env TOGETHER_API_KEY
  # in gitignored v2/.env). All ids VERIFIED against Together /models 2026-07-11.
  # ===========================================================================
  - {key: qwen25-14b-api, backend: openai_compat, provider: together, base_url: "https://api.together.xyz/v1", api_key_env: TOGETHER_API_KEY, model_id: "Qwen/Qwen2.5-14B-Instruct", role_axis: base, scale_tier: 14b, think_style: none, contrast: "C2-sft-14b", max_tokens: 4096, concurrency: 16, enabled: false}  # Together: distill half non-serverless -> C2 stays local/other provider
  - {key: r1-distill-qwen-14b-api, backend: openai_compat, provider: together, base_url: "https://api.together.xyz/v1", api_key_env: TOGETHER_API_KEY, model_id: "deepseek-ai/DeepSeek-R1-Distill-Qwen-14B", role_axis: reasoning, scale_tier: 14b, think_style: none, contrast: "C2-sft-14b", max_tokens: 16384, concurrency: 16, enabled: false}  # Together: distill half non-serverless -> C2 stays local/other provider
  - {key: llama33-70b-api, backend: openai_compat, provider: together, base_url: "https://api.together.xyz/v1", api_key_env: TOGETHER_API_KEY, model_id: "meta-llama/Llama-3.3-70B-Instruct-Turbo", role_axis: base, scale_tier: 70b, think_style: none, contrast: "C2-sft-70b", max_tokens: 4096, concurrency: 16, enabled: false}  # Together: distill half non-serverless -> C2 stays local/other provider
  - {key: r1-distill-llama-70b-api, backend: openai_compat, provider: together, base_url: "https://api.together.xyz/v1", api_key_env: TOGETHER_API_KEY, model_id: "deepseek-ai/DeepSeek-R1-Distill-Llama-70B", role_axis: reasoning, scale_tier: 70b, think_style: none, contrast: "C2-sft-70b", max_tokens: 16384, concurrency: 16, enabled: false}  # Together: distill half non-serverless -> C2 stays local/other provider
  - {key: qwen3-8b-think-api, backend: openai_compat, provider: together, base_url: "https://api.together.xyz/v1", api_key_env: TOGETHER_API_KEY, model_id: "Qwen/Qwen3-8B", role_axis: reasoning, scale_tier: 8b, think: true, think_style: qwen_slash, contrast: "C1-reason,C3-scale", max_tokens: 16384, concurrency: 16, enabled: false}  # NON-serverless on Together -> run local
  - {key: qwen3-8b-nothink-api, backend: openai_compat, provider: together, base_url: "https://api.together.xyz/v1", api_key_env: TOGETHER_API_KEY, model_id: "Qwen/Qwen3-8B", role_axis: base, scale_tier: 8b, think: false, think_style: qwen_slash, contrast: "C1-reason", max_tokens: 4096, concurrency: 16, enabled: false}  # NON-serverless on Together -> run local
  - {key: qwen3-14b-think-api, backend: openai_compat, provider: together, base_url: "https://api.together.xyz/v1", api_key_env: TOGETHER_API_KEY, model_id: "Qwen/Qwen3-14B", role_axis: reasoning, scale_tier: 14b, think: true, think_style: qwen_slash, contrast: "C1-reason,C3-scale", max_tokens: 16384, concurrency: 16, enabled: false}  # NON-serverless on Together -> run local
  - {key: qwen3-14b-nothink-api, backend: openai_compat, provider: together, base_url: "https://api.together.xyz/v1", api_key_env: TOGETHER_API_KEY, model_id: "Qwen/Qwen3-14B", role_axis: base, scale_tier: 14b, think: false, think_style: qwen_slash, contrast: "C1-reason", max_tokens: 4096, concurrency: 16, enabled: false}  # NON-serverless on Together -> run local
  - {key: qwen3-32b-think-api, backend: openai_compat, provider: together, base_url: "https://api.together.xyz/v1", api_key_env: TOGETHER_API_KEY, model_id: "Qwen/Qwen3-32B", role_axis: reasoning, scale_tier: 32b, think: true, think_style: qwen_slash, contrast: "C1-reason,C3-scale", max_tokens: 16384, concurrency: 16, enabled: false}  # NON-serverless on Together -> run local
  - {key: qwen3-32b-nothink-api, backend: openai_compat, provider: together, base_url: "https://api.together.xyz/v1", api_key_env: TOGETHER_API_KEY, model_id: "Qwen/Qwen3-32B", role_axis: base, scale_tier: 32b, think: false, think_style: qwen_slash, contrast: "C1-reason", max_tokens: 4096, concurrency: 16, enabled: false}  # NON-serverless on Together -> run local
  - {key: gemma4-31b-api, backend: openai_compat, provider: together, base_url: "https://api.together.xyz/v1", api_key_env: TOGETHER_API_KEY, model_id: "google/gemma-4-31B-it", role_axis: base, scale_tier: 31b, think_style: none, max_tokens: 16384, concurrency: 16, enabled: true}
  - {key: qwen36-35b-a3b-api, backend: openai_compat, provider: together, base_url: "https://api.together.xyz/v1", api_key_env: TOGETHER_API_KEY, model_id: "Qwen/Qwen3.6-35B-A3B-FP8", role_axis: reasoning, scale_tier: 35b-moe, think_style: none, max_tokens: 16384, concurrency: 16, enabled: false}  # NON-serverless on Together -> run local
  - {key: gpt-oss-120b-api, backend: openai_compat, provider: together, base_url: "https://api.together.xyz/v1", api_key_env: TOGETHER_API_KEY, model_id: "openai/gpt-oss-120b", role_axis: reasoning, scale_tier: 120b-moe, think_style: none, max_tokens: 16384, concurrency: 16, enabled: true}

