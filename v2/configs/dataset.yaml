# Procedural generator config (T3/T8). Every instance is dual-verified (SymPy MNA == NGSPICE .op)
# and regime-tagged BY CODE (not by hand). Trap:Control is rejection-sampled to ~1:1.

seed: 20260709
n_physics: 500              # distinct physics instances (before contract x method expansion)
methods: [KVL, KCL]         # each physics instance is posed under both
tolerance_rel: 1.0e-4       # SymPy vs NGSPICE agreement gate (reject instance if exceeded)

topologies:                 # 5 v1 families port directly; each gains branch_current + element_voltage outputs
  - {name: supermesh,   weight: 1.0}
  - {name: opposing_t,  weight: 1.0}
  - {name: wheatstone,  weight: 1.0}
  - {name: ladder,      weight: 1.0}
  - {name: vcvs,        weight: 1.0}

parameters:                 # sampling distributions (sign allowed on sources -> drives sign-flip Traps)
  resistor:        {dist: loguniform, low: 1.0e2, high: 1.0e5}   # ohms
  voltage_source:  {dist: uniform,    low: -100,  high: 100}     # volts
  current_source:  {dist: uniform,    low: -10,   high: 10}      # mA
  dependent_gain:  {dist: uniform,    low: -4,    high: 4}
  round_sig_figs:  3

regime_tags:                # code predicates on `values`/solution; presence of any trap tag => Trap
  - dominant_current_negative   # net flow opposes left-to-right intuition
  - max_r_ratio_gt_100          # extreme resistance ratio (stiff coupled system)
  - near_cancellation           # sources nearly cancel -> small signed result
  - dependent_dominates         # dependent source drives the sign (vcvs only)
target_trap_fraction: 0.5

contamination_guard:
  dedupe_instance_hash: true    # sha over (topology, rounded values, contract) across all splits
  exclude_v1_manifest: true     # never emit an instance whose hash collides with the 50 v1 instances
  canary_guid_per_release: true # embedded canary string to detect future leakage
  hold_test_split_unreleased: true
