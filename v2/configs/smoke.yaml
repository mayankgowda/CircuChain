# Tiny end-to-end smoke config: runs in minutes. `make smoke`.
# model_id below is the smallest VIABLE text model on this M5 (verified via lms ls;
# qwen2.5-7b-instruct is a corrupt 84MB download). Pre-load it first:
#     lms load qwen/qwen3.5-9b --context-length 16384 --gpu max -y
# N = n_physics x 4 cells x 2 methods = 16 completions.
seed: 1
n_physics: 2
methods: [KVL, KCL]
tolerance_rel: 1.0e-4
topologies:
  - {name: supermesh, weight: 1}
  - {name: supernode, weight: 1}
parameters:
  resistor:       {dist: loguniform, low: 1.0e2, high: 1.0e5}
  voltage_source: {dist: uniform, low: -100, high: 100}
  current_source: {dist: uniform, low: -10, high: 10}
  dependent_gain: {dist: uniform, low: -4, high: 4}
  round_sig_figs: 3

defaults:
  backend: lmstudio
  host: "http://localhost:1234"
  temperature: 0.0
  seed: 1
  max_tokens: 12288         # 9B thinks 3-4k tokens on real problems; 4096 truncated 16/16
  num_ctx: 16384

models:
  - {key: smoke-9b, model_id: "qwen/qwen3.5-9b", backend: lmstudio, family: qwen3.5,
     role_axis: reasoning, think: true, think_style: qwen_slash, enabled: true}
